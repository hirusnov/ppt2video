services:
  - type: web
    name: ppt2video-backend
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_ENV
        value: production
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: JOB_TIMEOUT_MINUTES
        value: "10"
      - key: FRONTEND_URL
        value: https://ppt2video.vercel.app
